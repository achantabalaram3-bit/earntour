<!doctype html>
<html lang="en-IN">
<head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- Content-Security-Policy: defense-in-depth for XSS (data persists via localStorage in this app). -->
        <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' http://127.0.0.1:8000 http://localhost:8000 https: data: blob:; media-src 'self' https: data: blob:; connect-src 'self' http://127.0.0.1:8000 http://localhost:8000 https: wss:; font-src 'self' https: data:; base-uri 'self'; form-action 'self';" />
        <meta name="referrer" content="strict-origin-when-cross-origin" />
        <meta name="theme-color" content="#21133d" />
        <link rel="icon" type="image/png" href="/tallskill-favicon.png" />

        <!-- TallSkill PWA -->
        <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/tallskill-apple-touch-180.png" />

        <meta name="description" content="TallSkill — free-to-play skill championships for India. Play skill games, climb the Free World leaderboard and compete in championships. No deposits, no paid entry." />
        <meta name="keywords" content="TallSkill, skill games, free to play, skill championships, india, leaderboard, puzzle games" />
        <meta name="author" content="TallSkill" />
        <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
        <link rel="canonical" href="/" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="TallSkill" />
        <meta property="og:title" content="TallSkill — Free-to-Play Skill Championships" />
        <meta property="og:description" content="Play skill games, climb the Free World leaderboard and compete in championships. Free to play — no deposits, no paid entry." />
        <meta property="og:url" content="/" />
        <meta property="og:image" content="/tallskill-og.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:locale" content="en_IN" />

        <!-- Twitter -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="TallSkill — Free-to-Play Skill Championships" />
        <meta name="twitter:description" content="Free-to-play skill championships. No deposits, no paid entry." />
        <meta name="twitter:image" content="/tallskill-og.png" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />

        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->

        <title>TallSkill — Free-to-Play Skill Championships</title>

        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>

        <script src="https://assets.emergent.sh/scripts/emergent-main.js"></script>

        <!-- TallSkill PWA install metadata -->
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="TallSkill" />

        <!-- Site-wide structured data (renders without JS for all crawlers) -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "name": "TallSkill",
          "url": "/",
          "logo": "/tallskill-logo.png",
          "sameAs": []
        }
        </script>
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": "TallSkill",
          "url": "/",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "/competitions?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
        </script>
    </head>

    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>

</html>
